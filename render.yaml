services:
  - type: web
    name: trusttaps
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CURRENCY
        value: usd
      - key: PRODUCT_NAME
        value: TrustTaps Google Review Card
      - key: UNIT_AMOUNT
        value: "2499"
      - key: SHIPPING_AMOUNT
        value: "0"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: BASE_URL
        value: https://trusttaps.onrender.com
